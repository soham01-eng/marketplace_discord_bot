[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-discord-bot"
version = "0.1.0"
description = "A Discord bot that tracks marketplace listings and sends notifications."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Soham Bhavsar" }]
dependencies = [
    "discord.py>=2.3,<3",
    "httpx>=0.27,<1",
    "playwright>=1.40,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.8,<1",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I"]
